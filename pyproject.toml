[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riscos-dumpsprites"
version = "0.1.0"
description = "Display information about RISC OS sprite files"
requires-python = ">=3.9"

[project.scripts]
riscos-dumpsprites = "riscos_dumpsprites.cli:main"

